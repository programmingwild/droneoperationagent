# Render Blueprint — deploy the FastAPI + React SPA with a FREE external Postgres.
# Render Dashboard → New → Blueprint → connect this repo → Apply.
# A push to master then redeploys automatically (autoDeploy: true).
#
# Database: Neon's free tier is permanent (no 30-day expiry, no card required).
# 1) Sign up at https://neon.tech and create a project.
# 2) Copy its Postgres connection string (postgres://...).
# 3) Set it as the DATABASE_URL secret on this service in the Render dashboard.
version: 1

services:
  - type: web
    name: drone-ops-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: VECTOR_BACKEND
        value: local
      - key: GROQ_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: PINECONE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
