# Render Blueprint — deploy the FastAPI + React SPA with a managed Postgres.
# Render Dashboard → New → Blueprint → connect this repo → Apply.
# A push to master then redeploys automatically (autoDeploy: true).
version: 1

services:
  - type: web
    name: drone-ops-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: VECTOR_BACKEND
        value: local
      - key: GROQ_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: PINECONE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: droneops-db
          property: connectionString

databases:
  - name: droneops-db
    plan: free
    postgresMajorVersion: "16"
