name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
      - name: Ingest corpus (local embeddings)
        run: python -m backend.app.rag.ingest --reset
      - name: Eval harness (retrieval hit-rate)
        run: python -m backend.app.evals.run_eval
      - name: pytest
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install SPA dependencies
        run: npm ci --prefix web
      - name: Build React SPA
        run: npm run build --prefix web

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t droneops-agent .

  trace-snapshot:
    # Optional: only when the repo admin adds LANGSMITH_API_KEY (+ optional GROQ_API_KEY)
    # secrets. Forks and PRs without secrets stay green (the script no-ops).
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -r requirements.txt
      - name: Ingest corpus (local embeddings)
        run: python -m backend.app.rag.ingest --reset
      - name: Generate LangSmith trace snapshot
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: droneops-ci
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/ci_trace_snapshot.py
      - name: Upload artifact
        if: hashFiles('docs/langsmith_trace.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: langsmith-trace-snapshot
          path: docs/langsmith_trace.html
          retention-days: 30
